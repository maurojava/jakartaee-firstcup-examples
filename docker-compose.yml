networks:
  app-net:
    driver: bridge

services:
  # 1. Database MariaDB
  db:
    image: mariadb:10.11
    container_name: firstcup-mariadb
    restart: unless-stopped
    env_file:
      - .env          # <--- LEGGE AUTOMATICAMENTE LE VARIABILI DAL FILE .ENV
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-net

  # 2. Server Payara (per l'applicazione Jakarta EE)
  payara-app:
    image: payara/server-full:6.2023.12-jdk17
    container_name: firstcup-payara
    restart: unless-stopped
    ports:
      - "2692:8080"
      - "2698:4848"
    env_file:
      - .env          # <--- LEGGE IL FILE .ENV ANCHE QUI SE NECESSARIO
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - db
    networks:
      - app-net

  # 3. Jenkins (per la CI/CD)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: firstcup-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # Permette a Jenkins di usare Docker sulla VPS
    networks:
      - app-net

volumes:
  mariadb_data:
  jenkins_home:

